<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Contador de postres</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2f8;--sf:#fff;--tx:#231f2b;--mu:#6d6678;--ln:#e4e0ec;--ac:#7c3aed;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141c;--sf:#231f2b;--tx:#f3eff8;--mu:#a49cb3;--ln:#352f40;--ac:#a78bfa}}
:root[data-theme="dark"]{--bg:#17141c;--sf:#231f2b;--tx:#f3eff8;--mu:#a49cb3;--ln:#352f40;--ac:#a78bfa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Baloo 2',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:500}
main{max-width:520px;margin:0 auto;padding:14px 14px 96px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.hero{padding:6px 4px 14px}
.date{color:var(--mu);font-size:16px}
.total{font-size:54px;font-weight:800;line-height:1.05}
.sub{color:var(--mu)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sale{display:flex;flex-direction:column;align-items:flex-start;min-height:168px;padding:14px 16px;border-radius:22px;color:#fff;text-align:left;transition:transform .08s}
.sale:active{transform:scale(.96)}
.sale .nm{font-weight:800;font-size:19px;line-height:1.1}
.sale .pr{opacity:.9;font-size:15px}
.sale .ct{font-size:60px;font-weight:800;line-height:1;margin-top:auto}
.sale .subt{opacity:.9;font-size:15px}
.undo{width:100%;margin-top:14px;padding:14px;border-radius:16px;background:var(--sf);border:1.5px solid var(--ln);font-weight:700}
.undo:disabled{opacity:.4}
.hint{color:var(--mu);background:var(--sf);border:1.5px dashed var(--ln);border-radius:16px;padding:12px 14px;margin:14px 0 0}
h2{font-size:20px;font-weight:800;margin:6px 4px 10px}
.row{display:flex;align-items:center;gap:10px;background:var(--sf);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.dot{width:30px;height:30px;border-radius:50%;flex:none;padding:0;border:3px solid var(--sf);box-shadow:0 0 0 2px var(--ln)}
button.dot:active{transform:scale(.88)}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}
.sw button{aspect-ratio:1;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:var(--tx)}
.back{background:none;color:var(--ac);font-weight:800;padding:6px 4px;font-size:18px}
.di{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:1.5px solid var(--ln);background:var(--sf);color:var(--tx)}
.dayc{display:block;width:100%;text-align:left}
.red{color:#dc2626;font-size:16px;font-weight:800}
label.undo{display:block;text-align:center}
.row .n{flex:1;font-weight:700;overflow-wrap:anywhere}
.pill{font-weight:800;padding:2px 10px;border-radius:99px;color:#fff;font-size:15px}
.x{background:none;font-size:22px;color:var(--mu);padding:0 6px}
.add{display:flex;gap:8px;margin-bottom:10px}
.add input{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:14px;border:1.5px solid var(--ln);background:var(--sf);color:var(--tx)}
.add button{background:var(--ac);color:#fff;font-weight:800;padding:0 18px;border-radius:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{background:var(--sf);border:1.5px solid var(--ln);border-radius:99px;padding:6px 14px;font-weight:700}
.bar{height:8px;border-radius:9px;margin-top:4px}
.card{background:var(--sf);border-radius:18px;padding:12px 14px;margin-bottom:10px}
.card .t{display:flex;justify-content:space-between;font-weight:800}
.card .d{color:var(--mu);font-size:15px;margin-top:2px}
.note{color:var(--mu);font-size:14px;margin:4px 4px 14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1.5px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;padding:14px 4px;font-weight:700;color:var(--mu)}
nav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:5}
.sheet{width:100%;max-width:520px;margin:0 auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:22px;font-weight:800}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.fl button{color:#fff;font-weight:800;font-size:19px;padding:20px 8px;border-radius:18px;overflow-wrap:anywhere}
.fl button:active{transform:scale(.95)}
.cancel{width:100%;padding:12px;border-radius:14px;background:var(--sf);border:1.5px solid var(--ln);font-weight:700}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const PR={mini:2000,pote:4000,p2:7000,p3:10000},NEED={mini:1,pote:1,p2:2,p3:3};
const NM={mini:'Minipote',pote:'Pote normal',p2:'Promo 2 potes',p3:'Promo 3 potes'};
const CO={mini:'#d6247a',pote:'#e0600a',p2:'#7c3aed',p3:'#0d8478'};
const PAL=['#e11d48','#ea580c','#d97706','#ca8a04','#65a30d','#16a34a','#0d9488','#0891b2','#2563eb','#4f46e5','#7c3aed','#c026d3','#db2777','#78350f','#475569'];
let S={days:{}},tab='vender',P=null,HS=null,CP=null,DEL='',MSG='',RT=false;
try{S=JSON.parse(localStorage.getItem('postres')||'')||S}catch(e){}
S.days=S.days||{};S.colors=S.colors||{};
const save=()=>{try{localStorage.setItem('postres',JSON.stringify(S))}catch(e){}};
const key=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const get=k=>S.days[k]||{flavors:[],sales:[]};
const ens=()=>S.days[key()]||(S.days[key()]={flavors:[],sales:[]});
const money=n=>'$'+n.toLocaleString('es-AR');
const col=n=>PAL[S.colors[n]!=null?S.colors[n]:[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length];
const fecha=k=>{const[y,m,d]=k.split('-');const s=new Date(y,m-1,d).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});return s[0].toUpperCase()+s.slice(1)};
function h(t,a,...k){const e=document.createElement(t);for(const x in a||{}){if(x==='on')for(const v in a.on)e.addEventListener(v,a.on[v]);else if(x==='style')e.style.cssText=a[x];else if(x==='class')e.className=a[x];else e[x]=a[x]}k.flat(9).filter(c=>c!=null&&c!==false).forEach(c=>e.append(c));return e}
function stats(sales){const f={},c={mini:0,pote:0,p2:0,p3:0};let total=0;
sales.forEach(s=>{total+=PR[s.t];c[s.t]++;s.i.forEach(n=>{if(!n)return;const o=f[n]||(f[n]={mini:0,pote:0});o[s.t==='mini'?'mini':'pote']++})});return{f,c,total}}
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}};
function commit(t,items){ens().sales.push({t,i:items,at:Date.now()});save();buzz()}
function start(t){if(!get(key()).flavors.length){commit(t,[]);render();return}P={t,picked:[]};render()}
function pick(n){P.picked.push(n);if(P.picked.length===NEED[P.t]){commit(P.t,P.picked);P=null}else buzz();render()}
function undo(){const d=ens();d.sales.pop();save();render()}

function vender(){const d=get(key()),st=stats(d.sales);
return h('div',{},
h('div',{class:'hero'},h('div',{class:'date'},fecha(key())),h('div',{class:'total'},money(st.total)),h('div',{class:'sub'},d.sales.length+' ventas hoy')),
h('div',{class:'grid'},['mini','pote','p2','p3'].map(t=>h('button',{class:'sale',style:'background:'+CO[t],on:{click:()=>start(t)}},
h('span',{class:'nm'},NM[t]),h('span',{class:'pr'},money(PR[t])),h('span',{class:'ct'},String(st.c[t])),h('span',{class:'subt'},money(st.c[t]*PR[t]))))),
d.flavors.length?null:h('p',{class:'hint'},'Aún no cargaste sabores de hoy. Ve a la pestaña Sabores para agregarlos y registrar cuál se vende más.'),
h('button',{class:'undo',disabled:!d.sales.length,on:{click:undo}},'Deshacer última venta'))}

function sheet(){const d=get(key()),n=NEED[P.t],i=P.picked.length;
return h('div',{class:'ov',on:{click:e=>{if(e.target.className==='ov'){P=null;render()}}}},h('div',{class:'sheet'},
h('h3',{},NM[P.t]),
h('div',{class:'sub'},n>1?'Elige el sabor del pote '+(i+1)+' de '+n:'¿Qué sabor es?'),
P.picked.length?h('div',{class:'chips',style:'margin-top:8px'},P.picked.map(x=>h('span',{class:'pill',style:'background:'+col(x)},x))):null,
h('div',{class:'fl'},d.flavors.map(f=>h('button',{style:'background:'+col(f),on:{click:()=>pick(f)}},f))),
h('button',{class:'cancel',on:{click:()=>{P=null;render()}}},'Cancelar')))}

function sabores(){const d=get(key()),st=stats(d.sales);
const inp=h('input',{placeholder:'Nuevo sabor, ej: Chocotorta',maxLength:30});
const add=n=>{n=(n||'').trim();if(!n)return;const dd=ens();if(!dd.flavors.some(f=>f.toLowerCase()===n.toLowerCase())){dd.flavors.push(n);if(S.colors[n]==null){const u=dd.flavors.map(f=>S.colors[f]);let i=0;while(u.includes(i)&&i<14)i++;S.colors[n]=i}}save();render()};
const past=[...new Set(Object.values(S.days).flatMap(x=>x.flavors))].filter(f=>!d.flavors.includes(f));
inp.addEventListener('keydown',e=>{if(e.key==='Enter')add(inp.value)});
return h('div',{},h('h2',{},'Sabores de hoy'),
h('div',{class:'add'},inp,h('button',{on:{click:()=>add(inp.value)}},'Agregar')),
past.length?h('div',{},h('div',{class:'note'},'Usados otros días, toca para agregar:'),h('div',{class:'chips'},past.map(f=>h('button',{class:'chip',on:{click:()=>add(f)}},'+ '+f)))):null,
d.flavors.length?d.flavors.map(f=>{const c=st.f[f]||{mini:0,pote:0};
return h('div',{class:'row'},h('button',{class:'dot',title:'Cambiar color',style:'background:'+col(f),on:{click:()=>{CP=f;render()}}}),h('span',{class:'n'},f),
h('span',{class:'pill',style:'background:'+CO.mini},'Mini '+c.mini),h('span',{class:'pill',style:'background:'+CO.pote},'Pote '+c.pote),
(c.mini+c.pote)?null:h('button',{class:'x',title:'Quitar',on:{click:()=>{const dd=ens();dd.flavors=dd.flavors.filter(x=>x!==f);save();render()}}},'×'))}):h('p',{class:'hint'},'Agrega los sabores que vendes hoy. Después, al tocar un botón de venta, eliges el sabor.'),d.flavors.length?h('p',{class:'note'},'Toca el círculo de color de un sabor para cambiarlo.'):null)}

function rank(all,sz,label){const arr=Object.entries(all).map(([n,o])=>[n,o[sz]]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
const mx=arr.length?arr[0][1]:1;
return h('div',{},h('h2',{},label),arr.length?arr.map(([n,v])=>h('div',{class:'row',style:'display:block'},h('div',{class:'t',style:'display:flex;justify-content:space-between;font-weight:700'},h('span',{},n),h('span',{},String(v))),h('div',{class:'bar',style:'width:'+Math.max(6,v/mx*100)+'%;background:'+col(n)}))):h('p',{class:'hint'},'Sin datos todavía.'))}

function dayDetail(k){const d=S.days[k]||{flavors:[],sales:[]},st=stats(d.sales);
return h('div',{},h('button',{class:'back',on:{click:()=>{HS=null;render()}}},'‹ Volver al historial'),
h('div',{class:'hero'},h('div',{class:'date'},fecha(k)),h('div',{class:'total'},money(st.total)),h('div',{class:'sub'},d.sales.length+' ventas')),
d.sales.length?[h('div',{class:'grid'},['mini','pote','p2','p3'].map(t=>h('div',{class:'sale',style:'background:'+CO[t]+';min-height:112px'},h('span',{class:'nm'},NM[t]),h('span',{class:'ct',style:'font-size:44px'},String(st.c[t])),h('span',{class:'subt'},money(st.c[t]*PR[t]))))),
h('h2',{style:'margin-top:16px'},'Por sabor'),
Object.keys(st.f).length?Object.entries(st.f).map(([n,o])=>h('div',{class:'row'},h('span',{class:'dot',style:'background:'+col(n)}),h('span',{class:'n'},n),h('span',{class:'pill',style:'background:'+CO.mini},'Mini '+o.mini),h('span',{class:'pill',style:'background:'+CO.pote},'Pote '+o.pote))):h('p',{class:'note'},'Ventas sin sabor asignado.'),
h('h2',{style:'margin-top:16px'},'Ventas del día'),
d.sales.map((s,i)=>{const id=k+':'+i;return h('div',{class:'row'},h('span',{class:'n'},NM[s.t]+(s.i.length?': '+s.i.join(', '):'')),
h('span',{class:'sub'},(s.at?new Date(s.at).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})+' · ':'')+money(PR[s.t])),
h('button',{class:'x'+(DEL===id?' red':''),on:{click:()=>{if(DEL===id){S.days[k].sales.splice(i,1);DEL='';save()}else DEL=id;render()}}},DEL===id?'¿Borrar?':'×'))}).reverse()]
:h('p',{class:'hint'},'No hay ventas registradas este día.'))}

async function exportar(){const txt=JSON.stringify(S);
try{const dl=window.claude&&await window.claude.use('downloads');
if(dl){try{await dl.save({filename:'copia-postres-'+key()+'.json',data:txt});return say('Copia guardada.')}catch(e){return say('No se guardó la copia.')}}}catch(e){}
try{const sh=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Share;
if(sh){await sh.share({title:'Copia de Contador de postres',text:txt,dialogTitle:'Guardar copia'});return say('Listo. Guarda ese mensaje (por ejemplo en WhatsApp o Drive).')}}catch(e){return say('No se guardó la copia.')}
try{await navigator.clipboard.writeText(txt);say('Copia lista en el portapapeles. Pégala en una nota para guardarla.')}catch(e){say('No se pudo guardar la copia.')}}
function aplicar(t){try{const b=JSON.parse(t);Object.entries(b.days||{}).forEach(([k,v])=>{if(!S.days[k]||v.sales.length>S.days[k].sales.length)S.days[k]=v});S.colors=Object.assign({},b.colors,S.colors);save();RT=false;say('Copia restaurada.')}catch(e){say('Esa copia no es válida.')}}
function importar(f){const r=new FileReader();r.onload=()=>aplicar(r.result);r.readAsText(f)}
function say(m){MSG=m;render()}

function historial(){if(HS)return dayDetail(HS);
const ks=Object.keys(S.days).filter(k=>S.days[k].sales.length).sort().reverse();
const di=h('input',{type:'date',class:'di',max:key()});
di.addEventListener('change',()=>{if(di.value){HS=di.value;render()}});
const all=stats(ks.flatMap(k=>S.days[k].sales));const ta=h('textarea',{class:'di',rows:4,placeholder:'Pega aquí la copia'});
return h('div',{},h('h2',{},'Historial'),h('div',{class:'note'},'Elige una fecha para ver qué se vendió ese día:'),di,
ks.length?[h('h2',{style:'margin-top:16px'},'Días con ventas'),
ks.map(k=>{const st=stats(S.days[k].sales);return h('button',{class:'card dayc',on:{click:()=>{HS=k;render()}}},h('div',{class:'t'},h('span',{},fecha(k)),h('span',{},money(st.total))),h('div',{class:'d'},S.days[k].sales.length+' ventas: Mini '+st.c.mini+', Pote '+st.c.pote+', Promo 2: '+st.c.p2+', Promo 3: '+st.c.p3))}),
rank(all.f,'mini','Minipotes más vendidos'),rank(all.f,'pote','Potes más vendidos'),h('p',{class:'note'},'Los potes de las promos cuentan como potes normales.')]
:h('p',{class:'hint',style:'margin-top:14px'},'Todavía no hay ventas guardadas.'),
h('h2',{style:'margin-top:18px'},'Copia de seguridad'),
h('div',{class:'note'},'Los datos se guardan en este teléfono. Guarda una copia por si borran los datos del navegador o cambian de celular.'),
h('button',{class:'undo',style:'margin-top:6px',on:{click:exportar}},'Guardar copia'),
h('label',{class:'undo',style:'margin-top:8px'},'Restaurar copia',h('input',{type:'file',accept:'.json,application/json',style:'display:none',on:{change:e=>{if(e.target.files[0])importar(e.target.files[0])}}})),
h('button',{class:'undo',style:'margin-top:8px',on:{click:()=>{RT=!RT;render()}}},'Restaurar pegando el texto'),RT?[ta,h('button',{class:'undo',style:'margin-top:8px',on:{click:()=>aplicar(ta.value)}},'Restaurar')]:null,MSG?h('p',{class:'note'},MSG):null)}

function colorSheet(){return h('div',{class:'ov',on:{click:e=>{if(e.target.className==='ov'){CP=null;render()}}}},h('div',{class:'sheet'},
h('h3',{},'Color de '+CP),h('div',{class:'sub'},'Elige uno de los 15 colores'),
h('div',{class:'sw'},PAL.map((c,i)=>h('button',{class:col(CP)===c?'on':'',style:'background:'+c,on:{click:()=>{S.colors[CP]=i;save();CP=null;render()}}}))),
h('button',{class:'cancel',on:{click:()=>{CP=null;render()}}},'Cerrar')))}

function render(){const app=document.getElementById('app');app.replaceChildren(...[tab==='vender'?vender():tab==='sabores'?sabores():historial(),P?sheet():null,CP?colorSheet():null].filter(Boolean));
const nav=document.getElementById('nav');nav.replaceChildren(...[['vender','Vender'],['sabores','Sabores'],['historial','Historial']].map(([t,l])=>h('button',{class:tab===t?'on':'',on:{click:()=>{tab=t;P=null;CP=null;HS=null;MSG='';render()}}},l)))}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
try{const ic="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#7c3aed"/><text x="256" y="350" font-size="300" text-anchor="middle">🍨</text></svg>');
const m={name:'Contador de postres',short_name:'Postres',start_url:location.href,scope:location.href,display:'standalone',background_color:'#7c3aed',theme_color:'#7c3aed',icons:[{src:ic,sizes:'any',type:'image/svg+xml',purpose:'any'}]};
const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.append(l)}catch(e){}
render();
</script>
</body>
</html>
